# What Dependabot watches.
#
# The actions below are pinned by commit, which is what stops a tag being
# repointed at something else. The cost is that a pinned action never updates
# itself, including for its own security fixes — so Dependabot opens the pull
# request that moves the pin, and the pin stops being a way of going stale.
#
# Monthly rather than weekly: these move slowly, and a pull request nobody reads
# is worse than no pull request.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
